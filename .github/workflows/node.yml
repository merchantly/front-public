name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
         node-version-file: .nvmrc
    - name: Install dependencies
      run: yarn install
    - name: Build
      run: yarn build
    - name: Test prerender
      run: yarn test:prerender
    - name: Test browser
      run: yarn test:browser
