name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4

    - name: Build
      run: |
        npm install
        npm build
    - name: Tests
      run: |
        npm test:browser
        npm test:prerender
