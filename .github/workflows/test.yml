name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup mise
      uses: jdx/mise-action@v2
    - name: Install dependencies
      run: yarn install
    - name: Build
      run: yarn build
    - name: Test prerender
      run: yarn test:prerender
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Test mini_racer
      run: yarn test:mini_racer
    # Browser tests temporarily disabled - Enzyme/React 18 compatibility issues
    # See: https://github.com/enzymejs/enzyme/issues/2429
    # 13 tests fail due to:
    # - renderIntoDocument returns null in React 18
    # - Legacy context API deprecated
    # - Concurrent mode incompatibilities
    # To re-enable: fix remaining test failures or migrate to React Testing Library
    # - name: Install Playwright
    #   run: npx playwright install chromium --with-deps
    # - name: Test browser
    #   run: yarn test:browser
